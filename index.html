<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doge Drag Game</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
            <a class="navbar-brand" href="#">🐶 Doge Drag Game</a>
        </nav>
    </header>

    <div class="container mt-4">
        <h1 class="text-center mb-3">✨ Drag the Doge to Earn Points ✨</h1>

        <p class="text-center lead">
            Move Doge around the play area to increase your score.<br>
            <strong>Edges give bonus points!</strong>
        </p>

        <div class="row mt-4">
            <!-- Game Area -->
            <div class="col-lg-8 mb-4">
                <div id="containment-wrapper">
                    <img id="doge-meme-pic"
                        src="images/doge.png"
                        alt="Doge meme">
                </div>
            </div>

            <!-- Score Panel -->
            <div class="col-lg-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="text-center">Score</h3>
                        <h1 id="score-display" class="text-center text-success">0</h1>

                        <div class="progress mb-3">
                            <div id="score-progress" class="progress-bar bg-success" style="width:0%"></div>
                        </div>

                        <div class="alert alert-warning text-center" id="status-message">
                            Drag Doge to begin!
                        </div>

                        <p class="text-center mt-2">
                            High Score: <span id="high-score">0</span>
                        </p>

                        <div id="wow-output" class="text-center mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/scripts.js"></script>
</body>
</html>
